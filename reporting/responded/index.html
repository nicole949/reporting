<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JENTIS · Responded</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css?v=25">
<style>
.resp-snip{font-size:.8rem;color:var(--slate);background:var(--paper);border-left:3px solid #1FA294;border-radius:8px;padding:.4rem .6rem;margin:.25rem 0 .1rem;font-style:italic}
.ch-ic{font-size:1rem;margin-right:.2rem}
</style></head><body>
<div class="wrap">
  <div id="shell"></div>
  <div class="filters card" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">
    <select id="f-range"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="365">Last 365 days</option><option value="0">All time</option></select>
    <input id="f-search" type="search" placeholder="Search company or contact…" style="margin-left:auto">
  </div>
  <div class="metrics" id="metrics"></div>
  <div class="card"><h2>Responses <span>· company level, with who responded and how</span></h2>
    <div id="list" class="state">Loading…</div></div>
  <footer>Channels: ✉️ email reply · 🔗 LinkedIn reply via La Growth Machine · 📞 connected call — each with the reply text where synced.</footer>
</div>
<script src="../assets/config.js?v=25"></script><script src="../assets/app.js?v=25"></script>
<script>
R.shell('responded','Responded','Who answered — and what they said');
let entries=null,dims={},replies=[],calls=[],lreplies=[];
function render(){
  const days=Number(document.getElementById('f-range').value);
  const cut=days?new Date(Date.now()-days*86400000).toISOString().slice(0,10):'';
  const q=(document.getElementById('f-search').value||'').trim().toLowerCase();
  const list=entries.filter(e=>e.stage==='responded'&&(!cut||e.effective_date>=cut));
  const byCo={};
  for(const e of list) (byCo[e.company_id]=byCo[e.company_id]||[]).push(e);
  const rows=Object.entries(byCo).map(([cid,es])=>{
    const name=(dims[cid]&&dims[cid].name)||('#'+cid);
    const d0=es.map(e=>e.effective_date).sort()[0];
    const win=(ts,ref)=>Math.abs(Date.parse(ts)-Date.parse(ref))<=21*86400000;
    const rep=replies.filter(r=>String(r.company_id)===String(cid)&&win(r.date,d0));
    const con=calls.filter(c=>String(c.company_id)===String(cid)&&c.bucket==='connected'&&win(c.ts,d0));
    const lin=lreplies.filter(l=>String(l.company_id)===String(cid)&&win(l.date,d0));
    return {cid,name,date:d0,rep,con,lin};
  }).filter(r=>!q||r.name.toLowerCase().includes(q)||r.rep.some(x=>(x.contact_name||'').toLowerCase().includes(q))||r.lin.some(x=>(x.contact_name||'').toLowerCase().includes(q)))
    .sort((a,b)=>a.date<b.date?1:-1);
  document.getElementById('metrics').innerHTML=[
    ['Companies responded',rows.length],
    ['Email replies',rows.reduce((s,r)=>s+r.rep.length,0)],
    ['LinkedIn replies',rows.reduce((s,r)=>s+r.lin.length,0)],
    ['Connected calls',rows.reduce((s,r)=>s+r.con.length,0)]
  ].map(m=>'<div class="metric"><div class="label">'+m[0]+'</div><div class="val">'+m[1]+'</div></div>').join('');
  const el=document.getElementById('list');
  if(!rows.length){el.className='empty';el.textContent='No responses in this timeframe.';return;}
  el.className='';
  el.innerHTML=rows.map(r=>{
    const ch=[r.rep.length?'<span class="ch-ic">✉️</span>':'',r.lin.length?'<span class="ch-ic">🔗</span>':'',r.con.length?'<span class="ch-ic">📞</span>':''].join('');
    const contacts=[
      ...r.rep.map(x=>'<div class="mini">✉️ '+R.esc(x.contact_name||'Unknown')+' · '+R.fmtDate(x.date)+'</div>'+
        (x.reply_snippet?'<div class="resp-snip">“'+R.esc(x.reply_snippet)+'”</div>':'')),
      ...r.lin.map(x=>'<div class="mini">🔗 '+R.esc(x.contact_name||'Unknown')+' · '+R.fmtDate(x.date)+'</div>'+
        (x.reply_snippet?'<div class="resp-snip">“'+R.esc(x.reply_snippet)+'”</div>':'')),
      ...r.con.map(x=>'<div class="mini">📞 '+R.esc(x.contact_name||'')+' · '+R.fmtDate(x.ts)+(x.disposition_label?' · '+R.esc(x.disposition_label):'')+'</div>')
    ].join('');
    return '<div class="co" style="display:block;padding:.6rem 0;border-bottom:1px solid var(--hair)">'+
      '<div style="display:flex;gap:.6rem;align-items:center"><div class="nm"><a href="'+R.hs('0-2',r.cid)+'" target="_blank" rel="noopener">'+R.esc(r.name)+'</a></div>'+ch+
      '<span class="mini" style="margin-left:auto">responded '+R.fmtDate(r.date)+'</span></div>'+
      (contacts||'<div class="mini">No matched reply or call within ±3 weeks — response likely via another channel.</div>')+'</div>';
  }).join('');
}
(async function init(){
  const c=document.getElementById('list');
  try{
    const [en,dm,rp,lr,cl]=await Promise.all([
      R.fetchAll('company_stage_entries?suppressed=eq.false&stage=eq.responded&select=company_id,stage,effective_date'),
      R.fetchAll('company_dimensions?select=company_id,name'),
      R.fetchAll('email_replies?select=company_id,contact_name,date,reply_snippet').catch(()=>[]),
      R.fetchAll('linkedin_replies?select=company_id,contact_name,date,reply_snippet').catch(()=>[]),
      R.fetchAll('v_calls?select=company_id,contact_name,ts,bucket,disposition_label').catch(()=>[])]);
    entries=en; for(const d of dm) dims[d.company_id]=d; replies=rp; lreplies=lr; calls=cl;
  }catch(e){c.className='empty';c.textContent='Could not load: '+e.message;return;}
  for(const id of ['f-range']) document.getElementById(id).addEventListener('change',()=>entries&&render());
  document.getElementById('f-search').addEventListener('input',()=>entries&&render());
  render();
})();
</script></body></html>
