# Copies the deployed v1 dashboard (web root of vibe-reports.jentis.info, same FTP account as the v2 deploy) into
# archive/v1-live/ so pages can be ported to v2 from the exact code that is live.
# Only .html / .js / .css are copied; config.js (keys), dot-files and the v2 folders are left out.
# Run it by hand: Actions -> Snapshot v1 -> Run workflow.
name: Snapshot v1
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths: ['.github/workflows/snapshot-v1.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get -qq install -y lftp >/dev/null
          OUT=archive/v1-live; rm -rf "$OUT"; mkdir -p "$OUT"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30;
            mirror --verbose=1 --parallel=4 --no-perms -i '\.(html|js|css)$' -x '^v2' -x '^v2-staging' -x '(^|/)\.' -x 'config\.js$' / $OUT;
            bye"
          find "$OUT" -type d -empty -delete
          find "$OUT" -type f | sort | xargs wc -c | tail -80
      - name: Commit
        run: |
          git config user.name "v1-snapshot"; git config user.email "actions@users.noreply.github.com"
          git add -A archive/v1-live
          git diff --cached --quiet && echo "no changes" || { git commit -q -m "Snapshot of the live v1 dashboard"; git push -q; }
