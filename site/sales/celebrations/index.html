<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales celebration board · JENTIS Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/app.css?b=__BUILD__">
<link rel="stylesheet" href="../../assets/legacy.css?b=__BUILD__">
</head>
<body>
<div id="shell"></div>
<script src="../../assets/config.js?b=__BUILD__"></script>
<script src="../../assets/app.js?b=__BUILD__"></script>
<script>
const page = R.shell({ page: 'sales-celebrations', title: 'Sales celebration board', subtitle: 'Qualified accounts, new opportunities, won customers, record deals' });
page.innerHTML = '<div class="celebs" id="celebs"><div class="state">Loading…</div></div>';
const NB = /^(full license \(new business\)|jentis light)$/i;
async function load() {
  const get = q => R.fetchAll(q).catch(() => []);
  const [entries, dims, deals, discos] = await Promise.all([
    get('company_stage_entries?suppressed=eq.false&stage=in.(qualified,opportunity,customer)&select=stage,effective_date,company_id'),
    get('company_dimensions?select=company_id,name'),
    get('v_deals?select=deal_id,deal_name,company_id,company_name,dealtype,close_date,create_date,is_won,amount,owner_name'),
    get('v_discoveries?select=company_id,created_at,meeting_start,status')
  ]);
  const name = {}; for (const d of dims) name[d.company_id] = d.name;
  const cards = [];
  for (const e of entries) {
    if (e.stage === 'qualified') cards.push({ em: '✅', title: 'Qualified: ' + (name[e.company_id] || e.company_id), what: 'account qualified', when: e.effective_date, cls: 'win' });
    if (e.stage === 'opportunity') cards.push({ em: '🚀', title: 'New opportunity: ' + (name[e.company_id] || e.company_id), what: 'opportunity opened', when: e.effective_date, cls: 'win' });
  }
  const won = deals.filter(d => d.is_won && NB.test(d.dealtype || '')).sort((a, b) => (a.close_date || '').localeCompare(b.close_date || ''));
  let best = 0;
  const firstDisc = {}; for (const d of discos) if (d.status !== 'canceled') { const t = (d.created_at || d.meeting_start || '').slice(0, 10); if (t && (!firstDisc[d.company_id] || t < firstDisc[d.company_id])) firstDisc[d.company_id] = t; }
  for (const d of won) {
    const v = Number(d.amount) || 0;
    cards.push({ em: '🏆', title: 'New customer: ' + (d.company_name || name[d.company_id] || d.company_id), what: R.eur(v) + (d.owner_name ? ' · ' + d.owner_name : '') + ' · ' + d.dealtype, when: d.close_date, cls: 'win' });
    if (v > best && best > 0) cards.push({ em: '💎', title: 'Record contract value: ' + R.eur(v), what: (d.company_name || name[d.company_id]) + ' — beats the previous record of ' + R.eur(best), when: d.close_date, cls: 'record' });
    if (v > best) best = v;
    const fd = firstDisc[d.company_id];
    if (fd && d.close_date) { const days = Math.round((Date.parse(d.close_date) - Date.parse(fd)) / 864e5); if (days >= 0 && days <= 92) cards.push({ em: '⚡', title: 'Closed within a quarter: ' + (d.company_name || name[d.company_id]), what: 'discovery → customer in ' + days + ' days', when: d.close_date, cls: 'record' }); }
  }
  const byQ = {}; for (const d of won) { const [y, m] = (d.close_date || '').split('-').map(Number); if (!y) continue; const k = y + '-Q' + (Math.floor((m - 1) / 3) + 1); byQ[k] = (byQ[k] || 0) + 1; }
  const bestQ = Object.entries(byQ).sort((a, b) => b[1] - a[1])[0];
  if (bestQ) cards.push({ em: '📈', title: bestQ[1] + ' new customers in one quarter', what: 'best quarter so far · ' + bestQ[0], when: bestQ[0], cls: 'record' });
  R.celebBoard(document.getElementById('celebs'), cards);
}
load();
</script>
</body>
</html>
