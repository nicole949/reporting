<!-- GENERATED by tools/port_v1.py from archive/v1-live/cs-tickets/index.html — change the generator or the v1 source, not this file. -->
<div id="shell"></div>
<div id="page-content" class="v1" hidden>
<div class="filters"><span id="ownerbar" style="display:flex;gap:.4rem;flex-wrap:wrap"></span>
    <select id="f-status"><option value="open" selected>Open</option><option value="closed">Closed</option><option value="">All</option></select>
    <select id="f-range"><option value="">Created: any time</option></select>
    <input type="search" id="f-search" placeholder="Find ticket or company…" style="margin-left:auto"></div>
  <div class="metrics" id="metrics"></div>
  <div class="card"><h2>Tickets <span id="n"></span></h2><div id="content" class="empty">Loading…</div></div>
  <footer>Source: Service Hub (pending the open question on ticket availability) · Age counts from creation · rows tinted red when open with no activity for 7+ days.</footer>

<script>
const C = window.RCONFIG;
R.shell({"page": "tickets", "title": "Tickets", "subtitle": "Support load per customer — filter by the owner of the company (tickets carry no owner in HubSpot)"});
R.legacyFilters({"period": {"f-range": "all"}, "labels": {"ownerbar": "Owner", "f-status": "Status", "f-range": "Period"}, "hints": {"f-range": "Tickets created in this period"}, "next": [], "stash": []});

</script>
<script>
let rows=null, owner='';
const isClosed=s=>/closed|solved|done|resolved/i.test(s||'');
function render(){
  const st=document.getElementById('f-status').value;
  const inR=R.rangeTest(document.getElementById('f-range').value);
  const q=(document.getElementById('f-search').value||'').trim().toLowerCase();
  const list=rows.filter(r=>(!owner||(r.company_owner_name||'Unassigned')===owner)
    &&(st===''||(st==='open'&&!isClosed(r.status))||(st==='closed'&&isClosed(r.status)))
    &&inR(r.created_at)
    &&(!q||((r.subject||'')+' '+(r.company_name||'')).toLowerCase().includes(q)));
  R.ownerPills(document.getElementById('ownerbar'),
    [...new Set(rows.map(r=>r.company_owner_name||'Unassigned'))].sort(), owner, o=>{owner=o;render();});
  const open=list.filter(r=>!isClosed(r.status));
  const stale=open.filter(r=>r.last_activity&&(Date.now()-Date.parse(r.last_activity))/86400000>7);
  R.metrics(document.getElementById('metrics'),[
    {label:'Tickets (in view)', val:R.num(list.length)},
    {label:'Open', val:open.length},
    {label:'High priority', val:open.filter(r=>/high|urgent/i.test(r.priority||'')).length,
     warn:open.some(r=>/high|urgent/i.test(r.priority||''))},
    {label:'😴 Quiet 7d+', val:stale.length, warn:stale.length>0}
  ]);
  document.getElementById('n').textContent='· '+list.length;
  R.table(document.getElementById('content'),[
    {key:'subject',label:'Ticket',cell:r=>'<strong>'+R.esc(r.subject||'—')+'</strong>'},
    {key:'company_name',label:'Company',cell:r=>r.company_id?('<a href="'+R.hs('0-2',r.company_id)+'" target="_blank" rel="noopener">'+R.esc(r.company_name||'—')+'</a>'):R.esc(r.company_name||'—')},
    {key:'status',label:'Status',cell:r=>R.badge(r.status||'—',isClosed(r.status)?'b-neutral':'b-info')},
    {key:'priority',label:'Priority',cell:r=>r.priority?R.badge(r.priority,/high|urgent/i.test(r.priority)?'b-bad':'b-neutral'):'—'},
    {key:'company_owner_name',label:'Company owner',cell:r=>R.esc(r.company_owner_name||'—')},
    {key:'created_at',label:'Created',cell:r=>R.fmtDate(r.created_at)},
    {key:'age',label:'Age',num:true,sortVal:r=>r.created_at?Math.round((Date.now()-Date.parse(r.created_at))/86400000):0,
     cell:r=>r.created_at?Math.round((Date.now()-Date.parse(r.created_at))/86400000)+'d':'—'},
    {key:'last_activity',label:'Last activity',cell:r=>R.fmtDate(r.last_activity)||'—'}
  ],list,{sort:{key:'last_activity',dir:-1},decorate:(el,sorted)=>{
    const trs=el.querySelectorAll('table.data tr');
    sorted.forEach((r,i)=>{const tr=trs[i+1];if(!tr)return;
      if(!isClosed(r.status)&&r.last_activity&&(Date.now()-Date.parse(r.last_activity))/86400000>7)
        tr.classList.add('row-lost');});
  }});
}
(async function init(){
  const c=document.getElementById('content');
  rows=await R.loadViewOrPending('v_cs_tickets?select=*', c, {
    title:'Customer Success pipeline not connected yet',
    text:'The cs-sync workflows fill this table once the open Service-Hub question is settled.',
    view:'v_cs_tickets'});
  if(!rows) return;
  R.quarterOptions(document.getElementById('f-range'));
  document.getElementById('f-status').addEventListener('change',()=>rows&&render());
  document.getElementById('f-range').addEventListener('change',()=>rows&&render());
  document.getElementById('f-search').addEventListener('input',()=>rows&&render());
  render();
})();
</script>
</body>
</html>
