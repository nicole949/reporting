<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Success overview · JENTIS Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css?b=__BUILD__">
<link rel="stylesheet" href="../assets/legacy.css?b=__BUILD__">
</head>
<body>
<div id="shell"></div>
<script src="../assets/config.js?b=__BUILD__"></script>
<script src="../assets/app.js?b=__BUILD__"></script>
<script src="../assets/help.js?b=__BUILD__"></script>
<script>
const page = R.shell({ page: 'cs-overview', title: 'Customer Success overview', subtitle: 'Customers, renewals, tickets and professional services — per period and per owner' });
page.innerHTML = '<div id="tiles" class="tiles" style="margin-bottom:1rem"></div><div class="grid c2"><div class="card"><h2>Renewals due in the period</h2><div id="ren"></div></div><div class="card"><h2>Customers needing attention <span class="muted small">· as of today</span></h2><div id="att"></div></div></div>';
let D = null, F = null;
const PS = /^professional service/i, REN = /^(early )?renewal$/i, UP = /^(upsell|expansion)$/i, NB = /^(full license \(new business\)|jentis light)$/i;
async function load() {
  const get = q => R.fetchAll(q).catch(() => []);
  const [cust, ren, tix, deals] = await Promise.all([
    get('v_cs_customers_ext?select=company_id,company_name,owner_name,mrr,next_renewal,status_code,status_text,open_tickets,usage_flag,unpaid_count'),
    get('v_cs_renewals?select=deal_id,company_id,company_name,owner_name,license_end,renewal_status,has_renewal_deal,amount,mrr,auto_renewal'),
    get('cs_tickets?select=ticket_id,company_id,created_at,status,owner_name'),
    get('v_deals?select=deal_id,deal_name,company_id,company_name,dealtype,close_date,is_won,amount,owner_name')
  ]);
  D = { cust, ren, tix, deals };
  const owners = [...new Set([...cust.map(c => c.owner_name), ...ren.map(r => r.owner_name)].filter(Boolean))].sort();
  F = R.filters({ defaultTime: 'quarter', controls: [{ key: 'owner', label: 'Owner', type: 'multi', options: owners.map(o => [o, o]) }], onChange: render });
  render();
}
function render() {
  const r = F.range, p = R.prevRange(r), own = F.owner || [];
  const mine = x => !own.length || own.includes(x.owner_name);
  const cust = D.cust.filter(mine), ren = D.ren.filter(mine), deals = D.deals.filter(mine);
  const custIds = new Set(cust.map(c => c.company_id));
  const tix = own.length ? D.tix.filter(t => custIds.has(t.company_id)) : D.tix;
  const won = (re, rg) => deals.filter(d => d.is_won && re.test(d.dealtype || '') && R.inRange(d.close_date, rg));
  const sum = a => a.reduce((t, d) => t + (Number(d.amount) || 0), 0);
  const due = rg => ren.filter(x => R.inRange(x.license_end, rg));
  const tixIn = rg => tix.filter(t => R.inRange(t.created_at, rg)).length;
  const mrr = cust.reduce((t, c) => t + (Number(c.mrr) || 0), 0);
  document.getElementById('tiles').innerHTML =
    R.kpi('Customers · now', R.num(cust.length), R.eur(mrr) + ' MRR', 'soft') +
    R.kpi('Customers signed', R.num(won(NB, r).length) + ' ' + R.delta(won(NB, r).length, won(NB, p).length), 'before: ' + won(NB, p).length) +
    R.kpi('Renewals due', R.num(due(r).length) + ' ' + R.delta(due(r).length, due(p).length), R.eur(sum(due(r))) + ' · ' + due(r).filter(x => x.has_renewal_deal).length + ' with a renewal deal') +
    R.kpi('Renewals won', R.num(won(REN, r).length) + ' ' + R.delta(won(REN, r).length, won(REN, p).length), R.eur(sum(won(REN, r)))) +
    R.kpi('Upsell & expansion won', R.num(won(UP, r).length) + ' ' + R.delta(won(UP, r).length, won(UP, p).length), R.eur(sum(won(UP, r)))) +
    R.kpi('Professional services sold', R.num(won(PS, r).length) + ' ' + R.delta(won(PS, r).length, won(PS, p).length), R.eur(sum(won(PS, r)))) +
    R.kpi('Tickets opened', R.num(tixIn(r)) + ' ' + R.delta(tixIn(r), tixIn(p)), 'before: ' + tixIn(p)) +
    R.kpi('Open tickets · now', R.num(tix.filter(t => !/closed|done|resolved/i.test(t.status || '')).length), '', 'soft');
  const d = due(r).sort((a, b) => (a.license_end || '').localeCompare(b.license_end || ''));
  document.getElementById('ren').innerHTML = d.length ? '<table class="data"><tr><th>Licence end</th><th>Company</th><th>Owner</th><th>Status</th><th style="text-align:right">Value</th></tr>' + d.map(x => '<tr><td>' + R.fmtDate(x.license_end) + '</td><td><a href="' + R.hs('0-2', x.company_id) + '" target="_blank" rel="noopener">' + R.esc(x.company_name || x.company_id) + '</a></td><td>' + R.esc(x.owner_name || '') + '</td><td>' + R.esc(x.renewal_status || '') + (x.auto_renewal ? ' · auto' : '') + '</td><td style="text-align:right">' + R.eur(x.amount || x.mrr) + '</td></tr>').join('') + '</table>' : '<div class="state">No renewals due in this period.</div>';
  const att = cust.filter(c => R.attention(c).length).sort((a, b) => (a.next_renewal || '9').localeCompare(b.next_renewal || '9'));
  document.getElementById('att').innerHTML = att.length ? '<table class="data"><tr><th>Company</th><th>Owner</th><th>Why</th><th style="text-align:right">Tickets</th></tr>' + att.slice(0, 25).map(c => '<tr><td><a href="' + R.C.SITE_BASE + 'cs/customers/?company=' + c.company_id + '">' + R.esc(c.company_name) + '</a></td><td>' + R.esc(c.owner_name || '') + '</td><td>' + R.esc(R.attention(c).join(' · ')) + '</td><td style="text-align:right">' + (c.open_tickets || 0) + '</td></tr>').join('') + '</table>' : '<div class="state">Nobody needs attention right now.</div>';
}
load();
</script>
</body>
</html>
