<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commercial overview · JENTIS Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?b=__BUILD__">
<link rel="stylesheet" href="assets/legacy.css?b=__BUILD__">
</head>
<body>
<div id="shell"></div>
<script src="assets/config.js?b=__BUILD__"></script>
<script src="assets/app.js?b=__BUILD__"></script>
<script src="assets/help.js?b=__BUILD__"></script>
<script>
const page = R.shell({ page: 'overview', title: 'Commercial overview', subtitle: 'Key numbers across the whole commercial journey — Marketing → Business Development → Sales → Customer Success' });
page.innerHTML = '<div class="kgroups" id="kg"><div class="state">Loading…</div></div><p class="small muted" style="margin-top:.8rem">Each tile compares the chosen period with the period of the same length before it; the bars show the period split by the chosen frequency. Click a tile to see the records behind the number. Tiles marked “now” are a snapshot and ignore the period.</p>';
let D = null, M = [];
const NB = /^(full license \(new business\)|jentis light)$/i, POC = /^poc$/i, PS = /^professional service/i, REN = /^(early )?renewal$/i;
const DAY = 864e5, esc = R.esc, d10 = v => v ? String(v).slice(0, 10) : '';
async function load() {
  const get = q => R.fetchAll(q).catch(() => []);
  const [entries, dims, seqDaily, email, inst, outreach, resp, calls, discos, deals, tickets, renewals] = await Promise.all([
    get('company_stage_entries?suppressed=eq.false&select=stage,effective_date,company_id'),
    get('company_dimensions?select=company_id,name'),
    get('sequence_daily?select=date,sequence_name,sends,new_recipients'),
    get('v_email_daily?select=date,sends'),
    get('instantly_daily?select=date,sent,new_leads_contacted'),
    get('v_outreach_events?channel=in.(linkedin_message,connection_request,follow)&select=channel,ts,contact_name,company_name'),
    get('v_responded_events?select=channel,ts,contact_name,company_name,category'),
    get('v_calls?select=ts,bucket,company_name,contact_name,owner_name,disposition_label'),
    get('v_discoveries?select=created_at,meeting_start,status,company_name,contact_name,owner_name'),
    get('v_deals?select=deal_id,deal_name,company_name,owner_name,dealtype,create_date,close_date,is_closed,is_won,amount,stage_label'),
    get('cs_tickets?select=ticket_id,subject,company_name,created_at,status'),
    get('v_cs_renewals?select=company_name,license_end,renewal_status,mrr,stage_label,owner_name')
  ]);
  D = { entries, dims, seqDaily, email, inst, outreach, resp, calls, discos, deals, tickets, renewals };
  build(); render();
}
const F = R.filters({ defaultTime: 'quarter', onChange: render, controls: [
  { key: 'freq', label: 'Frequency', value: 'auto', options: [['auto', 'Auto'], ['day', 'Daily'], ['week', 'Weekly'], ['month', 'Monthly']] }] });

// ---------- what every tile is made of ----------
// rows: the records · d: their date · n: what one record counts (default 1) · s: series for the stacked bars
// cols: columns of the record list · list: 'series' = list the series instead of single records · now: snapshot tile
const link = (type, id, txt) => id ? '<a href="' + R.hs(type, id) + '" target="_blank" rel="noopener">' + esc(txt || '—') + '</a>' : esc(txt || '—');
const C_DATE = (h, f) => [h, r => R.fmtDate(d10(f(r))), 'nw'];
function build() {
  const name = {}; D.dims.forEach(c => name[c.company_id] = c.name);
  const stage = (key, label, st) => ({ key, label, rows: D.entries.filter(e => e.stage === st), d: e => e.effective_date,
    cols: [C_DATE('Entered', e => e.effective_date), ['Company', e => link('0-2', e.company_id, name[e.company_id] || 'Company ' + e.company_id)]], more: ['marketing/leads/', 'Leads page'] });
  const nb = D.deals.filter(d => NB.test(d.dealtype || '') || POC.test(d.dealtype || ''));
  const won = D.deals.filter(d => d.is_won && NB.test(d.dealtype || ''));
  const dealCols = f => [C_DATE(f === 'create_date' ? 'Created' : 'Closed', d => d[f]), ['Deal', d => link('0-3', d.deal_id, d.deal_name)], ['Company', d => esc(d.company_name || '—')], ['Type', d => esc(d.dealtype || '—')], ['Stage', d => esc(d.stage_label || '—')], ['Amount', d => R.eur(d.amount), 'num'], ['Owner', d => esc(d.owner_name || '—')]];
  const emailRows = (D.seqDaily.length ? D.seqDaily.map(x => ({ d: x.date, n: x.sends, s: x.sequence_name || 'Sequence without a name', rec: x.new_recipients }))
      : D.email.map(x => ({ d: x.date, n: x.sends, s: 'HubSpot sequences', rec: null })))
    .concat(D.inst.map(x => ({ d: x.date, n: x.sent, s: 'Instantly (all campaigns)', rec: x.new_leads_contacted })));
  const LI = { connection_request: 'Connection request', linkedin_message: 'Message', follow: 'Follow' };
  const RT = { call: 'Connected call', email: 'Email reply', linkedin: 'LinkedIn reply' };
  const CB = { connected: 'Connected', rejected: 'Connected, rejected', no_contact: 'No contact' };
  const callCols = [C_DATE('Date', c => c.ts), ['Outcome', c => esc(c.disposition_label || CB[c.bucket] || '—')], ['Contact', c => esc(c.contact_name || '—')], ['Company', c => esc(c.company_name || '—')], ['Owner', c => esc(c.owner_name || '—')]];
  const discoCols = [C_DATE('Booked', x => x.created_at), C_DATE('Meeting', x => x.meeting_start), ['Company', x => esc(x.company_name || '—')], ['Contact', x => esc(x.contact_name || '—')], ['Status', x => esc(x.status || '—')], ['Owner', x => esc(x.owner_name || '—')]];
  const openTix = D.tickets.filter(t => !/closed|done|resolved|geschlossen/i.test(t.status || ''));
  const tixCols = [C_DATE('Created', t => t.created_at), ['Ticket', t => link('0-5', t.ticket_id, t.subject)], ['Company', t => esc(t.company_name || '—')], ['Status', t => esc(t.status || '—')]];
  M = [
    { key: 'mkt', name: 'Marketing', st: 'awareness → lead → response', tiles: [
      stage('leads', 'New leads', 'lead'),
      { key: 'emails', label: 'Outreach emails sent', rows: emailRows, d: x => x.d, n: x => x.n, s: x => x.s, list: 'series', unit: 'emails',
        seriesCols: [['Sequence', 'Emails sent', 'New recipients'], rows => rows.some(x => x.rec != null) ? rows.reduce((a, x) => a + (Number(x.rec) || 0), 0) : null], more: ['email-outreach/', 'Email outreach page'] },
      { key: 'linkedin', label: 'LinkedIn actions', rows: D.outreach, d: x => x.ts, s: x => LI[x.channel] || x.channel, order: Object.values(LI),
        cols: [C_DATE('Date', x => x.ts), ['Action', x => esc(LI[x.channel] || x.channel)], ['Contact', x => esc(x.contact_name || '—')], ['Company', x => esc(x.company_name || '—')]] },
      { key: 'responses', label: 'Responses', rows: D.resp, d: x => x.ts, s: x => RT[x.channel] || x.channel, order: Object.values(RT),
        cols: [C_DATE('Date', x => x.ts), ['Response', x => esc(RT[x.channel] || x.channel)], ['Contact', x => esc(x.contact_name || '—')], ['Company', x => esc(x.company_name || '—')]], more: ['marketing/responses/', 'Responses page'] },
      Object.assign(stage('st_responded', 'Engaged → Responded (stage)', 'responded'), {}) ] },
    { key: 'bd', name: 'Business Development', st: 'response → discovery', tiles: [
      { key: 'calls', label: 'Calls', rows: D.calls, d: c => c.ts, s: c => CB[c.bucket] || 'Other', order: Object.values(CB), cols: callCols, more: ['bd/calls/', 'Calls page'] },
      { key: 'connected', label: 'Connected calls', rows: D.calls.filter(c => c.bucket === 'connected' || c.bucket === 'rejected'), d: c => c.ts, s: c => CB[c.bucket], order: Object.values(CB), cols: callCols, more: ['bd/calls/', 'Calls page'] },
      { key: 'booked', label: 'Discoveries booked', rows: D.discos.filter(x => x.status !== 'canceled'), d: x => x.created_at || x.meeting_start, cols: discoCols, more: ['bd/discoveries/', 'Discoveries page'] },
      { key: 'held', label: 'Discoveries held', rows: D.discos.filter(x => x.status === 'completed'), d: x => x.meeting_start, cols: discoCols, more: ['bd/discoveries/', 'Discoveries page'] },
      stage('st_discovery', 'Entered Discovery (stage)', 'discovery') ] },
    { key: 'sales', name: 'Sales pipeline', st: 'qualified → closed won', tiles: [
      stage('st_qualified', 'Qualified accounts', 'qualified'), stage('st_opp', 'Opportunities', 'opportunity'),
      { key: 'created', label: 'Deals created (NB + POC)', rows: nb, d: x => x.create_date, s: x => x.dealtype, cols: dealCols('create_date'), more: ['sales/deals/', 'Deals page'] },
      { key: 'won', label: 'Won new business', rows: won, d: x => x.close_date, amount: x => x.amount, cols: dealCols('close_date'), more: ['sales/deals/', 'Deals page'] },
      { key: 'pipe', label: 'Open NB pipeline · now', now: true, eur: true, rows: nb.filter(x => !x.is_closed).sort((a, b) => (b.amount || 0) - (a.amount || 0)), n: x => Number(x.amount) || 0, cols: dealCols('create_date'), more: ['sales/deals/', 'Deals page'] } ] },
    { key: 'cs', name: 'Customer Success', st: 'onboarding → renewal → expansion', tiles: [
      stage('st_customer', 'Customers signed', 'customer'),
      { key: 'onb', label: 'In onboarding · now', now: true, rowsFor: r => { const from = new Date(Date.parse(r.to) - 90 * DAY).toISOString().slice(0, 10); return won.filter(x => x.close_date >= from && x.close_date < r.to); }, sub: 'signed in the 90 days before period end', cols: dealCols('close_date') },
      { key: 'rendue', label: 'Renewals due', rows: D.renewals, d: x => x.license_end, cols: [C_DATE('Licence end', x => x.license_end), ['Company', x => esc(x.company_name || '—')], ['MRR', x => R.eur(x.mrr), 'num'], ['Status', x => esc(String(x.renewal_status || '—').replace(/_/g, ' '))], ['Stage', x => esc(x.stage_label || '—')], ['Owner', x => esc(x.owner_name || '—')]], more: ['cs/renewals/', 'Renewals page'] },
      { key: 'renwon', label: 'Renewals won', rows: D.deals.filter(x => x.is_won && REN.test(x.dealtype || '')), d: x => x.close_date, cols: dealCols('close_date'), more: ['cs/renewals/', 'Renewals page'] },
      { key: 'ps', label: 'Professional services sold', rows: D.deals.filter(x => x.is_won && PS.test(x.dealtype || '')), d: x => x.close_date, amount: x => x.amount, cols: dealCols('close_date') },
      { key: 'tix', label: 'Tickets opened', rows: D.tickets, d: x => x.created_at, cols: tixCols, more: ['cs/tickets/', 'Tickets page'] },
      { key: 'tixopen', label: 'Open tickets · now', now: true, rows: openTix.sort((a, b) => (b.created_at || '') < (a.created_at || '') ? -1 : 1), cols: tixCols, more: ['cs/tickets/', 'Tickets page'] } ] }
  ];
}

// ---------- period → buckets ----------
function freqOf(r) {
  if (F.freq && F.freq !== 'auto') return F.freq;
  const days = (Math.min(Date.parse(r.to), Date.now() + DAY) - Date.parse(r.from)) / DAY;
  return days <= 21 ? 'day' : days <= 190 ? 'week' : 'month';
}
const FREQ = { day: 'daily', week: 'weekly', month: 'monthly' };
function buckets(r) {
  const f = freqOf(r), out = [], iso = t => new Date(t).toISOString().slice(0, 10);
  const end = Math.min(Date.parse(r.to), Date.parse(iso(Date.now())) + DAY);
  let a = Date.parse(r.from);
  while (a < end && out.length < 400) {
    const x = new Date(a); let b;
    if (f === 'day') b = a + DAY;
    else if (f === 'week') b = a + (7 - ((x.getUTCDay() + 6) % 7)) * DAY;            // up to the next Monday
    else b = Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 1);
    b = Math.min(b, Date.parse(r.to));
    const from = iso(a), to = iso(b);
    out.push({ from, to, label: f === 'month' ? x.toLocaleString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' }) : from.slice(8, 10) + '.' + from.slice(5, 7) + '.',
      title: f === 'day' ? R.fmtDate(from) : f === 'week' ? 'Week of ' + R.fmtDate(from) : x.toLocaleString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }) });
    a = b;
  }
  return out;
}
// ---------- numbers ----------
const valOf = (m, x) => m.n ? Number(m.n(x)) || 0 : 1;
const inR = (m, rg) => m.rows.filter(x => { const d = m.d(x); return d && R.inRange(String(d), rg); });
const total = (m, rows) => rows.reduce((a, x) => a + valOf(m, x), 0);
function seriesOf(m, rows) {                      // [{name, total}] — fixed order when given, else biggest first; at most 6 + Other
  if (!m.s) return [{ name: m.label, total: total(m, rows), ci: 0 }];
  const t = {}; rows.forEach(x => { const k = m.s(x) || '—'; t[k] = (t[k] || 0) + valOf(m, x); });
  let names = Object.keys(t).sort((a, b) => t[b] - t[a]);
  if (m.order) names = m.order.filter(n => t[n]).concat(names.filter(n => !m.order.includes(n)));
  const top = names.slice(0, names.length > 7 ? 6 : 7), rest = names.slice(top.length);
  const out = top.map((n, i) => ({ name: n, total: t[n], ci: m.order && m.order.includes(n) ? m.order.indexOf(n) : i }));   // fixed series keep their colour
  if (rest.length) out.push({ name: 'Other (' + rest.length + ')', total: rest.reduce((a, n) => a + t[n], 0), other: rest, ci: 6 });
  return out;
}
function matrix(m, rows, bk, ser) {                // value per bucket and series
  const idx = {}; ser.forEach((s, i) => { idx[s.name] = i; (s.other || []).forEach(n => idx[n] = i); });
  const grid = bk.map(() => ser.map(() => 0));
  rows.forEach(x => { const d = String(m.d(x)).slice(0, 10); const b = bk.findIndex(k => d >= k.from && d < k.to); if (b < 0) return; grid[b][m.s ? idx[m.s(x) || '—'] : 0] += valOf(m, x); });
  return grid;
}
const fmt = (m, v) => m.eur ? R.eur(v) : R.num(v);
function bars(m, bk, ser, grid, W, H, opts) {     // stacked bars; opts.labels: x axis labels + values, opts.pick: clickable
  opts = opts || {};
  const top = opts.labels ? 14 : 2, bot = opts.labels ? 16 : 0, h = H - top - bot, max = Math.max(1, ...grid.map(g => g.reduce((a, b) => a + b, 0)));
  const step = W / bk.length, bw = Math.max(1, Math.min(step - (step > 6 ? 2 : .5), 46)), every = Math.ceil(bk.length / Math.max(1, Math.floor(W / 46)));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (opts.labels ? W : '100%') + '" height="' + H + '"' + (opts.labels ? '' : ' preserveAspectRatio="none"') + ' role="img" aria-label="' + esc(m.label) + ' over time">';
  s += '<line class="ax" x1="0" x2="' + W + '" y1="' + (top + h + .5) + '" y2="' + (top + h + .5) + '"/>';
  bk.forEach((b, i) => {
    const sum = grid[i].reduce((a, v) => a + v, 0), x = i * step + (step - bw) / 2; let y = top + h;
    const tip = b.title + ': ' + fmt(m, sum) + (ser.length > 1 && sum ? '\n' + ser.map((q, k) => grid[i][k] ? q.name + ': ' + fmt(m, grid[i][k]) : '').filter(Boolean).join('\n') : '');
    s += '<g class="bk' + (opts.sel === i ? ' sel' : '') + '" data-b="' + i + '"><title>' + esc(tip) + '</title><rect class="hit" x="' + (i * step) + '" y="0" width="' + step + '" height="' + H + '"/>';
    grid[i].forEach((v, k) => { if (!v) return; const bh = Math.max(1, h * v / max); y -= bh; s += '<rect class="c' + ser[k].ci + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '"/>'; });
    if (opts.labels) {
      if (sum && step >= 22) s += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 3) + '" text-anchor="middle">' + (m.eur ? Math.round(sum / 1000) + 'k' : R.num(sum)) + '</text>';
      if (i % every === 0) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 3) + '" text-anchor="middle">' + esc(b.label) + '</text>';
    }
    s += '</g>';
  });
  return s + '</svg>';
}
// ---------- tiles ----------
function tileHtml(m, r, p, bk) {
  let val, sub, spark = '';
  if (m.now) {
    const rows = m.rowsFor ? m.rowsFor(r) : m.rows; m._rows = rows;
    val = fmt(m, m.n ? total(m, rows) : rows.length); sub = m.sub || 'as of today';
  } else {
    const rows = inR(m, r), prev = inR(m, p), cur = total(m, rows), was = total(m, prev); m._rows = rows;
    val = fmt(m, cur) + ' ' + R.delta(cur, was);
    sub = m.amount ? R.eur(rows.reduce((a, x) => a + (Number(m.amount(x)) || 0), 0)) + ' · before ' + R.eur(prev.reduce((a, x) => a + (Number(m.amount(x)) || 0), 0)) : 'before: ' + fmt(m, was);
    const ser = seriesOf(m, rows);
    spark = '<div class="spark">' + bars(m, bk, ser, matrix(m, rows, bk, ser), 200, 34) + '</div>';
  }
  return '<div class="tile clk' + (m.now ? ' soft' : '') + '" data-m="' + m.key + '" tabindex="0" role="button" title="Click to see the records behind this number"><div class="k">' + esc(m.label) + '</div><div class="v">' + val + '</div><div class="s">' + sub + '</div>' + spark + '</div>';
}
function render() {
  if (!D) return;
  const r = F.range, p = R.prevRange(r), bk = buckets(r);
  document.getElementById('kg').innerHTML = M.map(g => '<section class="kgroup ' + g.key + '"><div class="gh"><h2>' + g.name + '</h2><span class="st">' + g.st + '</span><span class="st" style="margin-left:auto">' + esc(r.label) + ' · ' + FREQ[freqOf(r)] + '</span></div><div class="tiles">' + g.tiles.map(m => tileHtml(m, r, p, bk)).join('') + '</div></section>').join('');
  if (drillKey) drill(drillKey, true);
}
// ---------- the records behind a tile ----------
let drillKey = null, drillSel = null;
const metric = k => M.flatMap(g => g.tiles).find(m => m.key === k);
function drill(key, keep) {
  const m = metric(key); if (!m) return;
  if (!keep) drillSel = null;
  drillKey = key;
  const r = F.range, bk = m.now ? [] : buckets(r);
  if (drillSel != null && drillSel >= bk.length) drillSel = null;
  let rows = (m._rows || []).slice();
  const ser = m.now ? [] : seriesOf(m, rows);
  let h = '<div class="dh"><div><h3>' + esc(m.label) + '</h3><div class="small muted">' + (m.now ? 'as of today' : esc(r.label) + ' · ' + FREQ[freqOf(r)]) + '</div></div><button class="x" type="button" aria-label="Close" onclick="closeDrill()">✕</button></div>';
  if (!m.now) {
    const el = document.getElementById('drill'), W = Math.max(320, Math.min(760, (el.clientWidth || 640) - 44));
    h += '<div class="dchart">' + bars(m, bk, ser, matrix(m, rows, bk, ser), W, 190, { labels: true, sel: drillSel }) + '</div>';
    if (ser.length > 1) h += '<div class="dleg">' + ser.map((q, k) => '<span><i class="c' + q.ci + '"></i>' + esc(q.name) + ' <b>' + fmt(m, q.total) + '</b></span>').join('') + '</div>';
    if (drillSel != null) { const b = bk[drillSel]; rows = rows.filter(x => { const d = String(m.d(x)).slice(0, 10); return d >= b.from && d < b.to; });
      h += '<div class="dsel">Showing <b>' + esc(b.title) + '</b> only · <a href="#" onclick="drillSel=null;drill(drillKey,true);return false">show the whole period</a></div>'; }
    else h += '<div class="dsel muted">Click a bar to see only that ' + ({ day: 'day', week: 'week', month: 'month' })[freqOf(r)] + '.</div>';
  }
  const moreLink = m.more ? ' · <a href="' + R.C.SITE_BASE.replace(/\/?$/, '/') + m.more[0] + '">Open the ' + m.more[1] + ' →</a>' : '';
  if (m.list === 'series') {
    const t = {}; rows.forEach(x => { const k = m.s(x) || '—'; (t[k] = t[k] || []).push(x); });
    const list = Object.entries(t).map(([k, a]) => [k, total(m, a), m.seriesCols[1](a)]).sort((a, b) => b[1] - a[1]);
    h += '<div class="dcount">' + R.num(list.length) + ' sequences / campaigns · ' + R.num(list.reduce((a, x) => a + x[1], 0)) + ' ' + (m.unit || '') + moreLink + '</div>';
    h += '<table><thead><tr><th>' + m.seriesCols[0][0] + '</th><th class="num">' + m.seriesCols[0][1] + '</th><th class="num">' + m.seriesCols[0][2] + '</th></tr></thead><tbody>' +
      list.map(x => '<tr><td>' + esc(x[0]) + '</td><td class="num">' + R.num(x[1]) + '</td><td class="num">' + R.num(x[2]) + '</td></tr>').join('') + '</tbody></table>';
  } else {
    if (m.d) rows.sort((a, b) => String(m.d(b) || '') < String(m.d(a) || '') ? -1 : 1);
    const CAP = 300, shown = rows.slice(0, CAP);
    h += '<div class="dcount">' + R.num(rows.length) + ' record' + (rows.length === 1 ? '' : 's') + (rows.length > CAP ? ' · the latest ' + CAP + ' are listed' : '') + moreLink + '</div>';
    h += rows.length ? '<table><thead><tr>' + m.cols.map(c => '<th class="' + (c[2] || '') + '">' + c[0] + '</th>').join('') + '</tr></thead><tbody>' +
      shown.map(x => '<tr>' + m.cols.map(c => '<td class="' + (c[2] || '') + '">' + c[1](x) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' : '<div class="state">Nothing in this period.</div>';
  }
  const el = document.getElementById('drill'); el.innerHTML = h; el.classList.add('open'); document.getElementById('drill-bg').classList.add('open');
  if (!keep) el.scrollTop = 0;
  el.querySelectorAll('.dchart .bk').forEach(g => g.onclick = () => { const i = +g.dataset.b; drillSel = drillSel === i ? null : i; drill(drillKey, true); });
}
function closeDrill() { drillKey = null; document.getElementById('drill').classList.remove('open'); document.getElementById('drill-bg').classList.remove('open'); }
document.body.insertAdjacentHTML('beforeend', '<div id="drill-bg" onclick="closeDrill()"></div><aside id="drill" aria-label="Records behind the number"></aside>');
document.getElementById('kg').addEventListener('click', e => { if (e.target.closest('.q, a')) return; const t = e.target.closest('.tile.clk'); if (t) drill(t.dataset.m); });
document.getElementById('kg').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('clk')) { e.preventDefault(); drill(e.target.dataset.m); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrill(); });
load();
</script>
</body>
</html>
